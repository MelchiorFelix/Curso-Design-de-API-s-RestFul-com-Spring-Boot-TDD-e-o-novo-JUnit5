name: Verify

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test, package, and resolve dependencies
        run: ./mvnw -B -ntp verify org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -DoutputFile=target/dependencies.json -DoutputType=json
      - name: Check resolved dependencies against OSV
        if: matrix.java == '17'
        shell: pwsh
        run: ./scripts/Test-Dependencies.ps1
      - name: Smoke-test packaged library API
        shell: bash
        run: |
          smoke_test() {
            java -jar "$1" --server.address=127.0.0.1 --server.port=18080 > app.log 2>&1 &
            app_pid=$!
            trap 'kill "$app_pid" 2>/dev/null || true' EXIT
            if ! curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --retry-max-time 60 "http://127.0.0.1:18080$2"; then
              cat app.log
              return 1
            fi
            kill "$app_pid"
            wait "$app_pid" || true
            trap - EXIT
          }
          smoke_test library-api/target/library-api-0.0.1-SNAPSHOT.jar /api/books
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/dependencies.json
            target/osv-dependencies.json
